name: Build and Deploy Documentation

on:
  push:
    branches: [ main, master, stable ]
  pull_request:
    branches: [ main, master, stable ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout S1MAPI
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create Assembly Directory Structure
        run: |
          mkdir -p Assemblies/Mono
          mkdir -p Assemblies/Il2Cpp

      - name: Cache Assemblies
        id: cache-assemblies
        uses: actions/cache@v4
        with:
          path: Assemblies
          key: mapi-assemblies-${{ hashFiles('S1MAPI.csproj') }}
          restore-keys: |
            mapi-assemblies-

      # Only checkout game assemblies if cache miss AND we have access to secrets
      - name: Checkout Game Assemblies
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.GAME_ASSEMBLIES_REPO }}
          token: ${{ secrets.GAME_REPOS_TOKEN }}
          path: game-assemblies
          fetch-depth: 1
        if: steps.cache-assemblies.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)

      - name: Populate Mono Assemblies
        if: steps.cache-assemblies.outputs.cache-hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          echo "=== Setting up Mono Assemblies ==="
          if [ -d "game-assemblies/Managed" ]; then
            cp -r game-assemblies/Managed/* Assemblies/Mono/
            echo "Copied Mono assemblies from game-assemblies/Managed/"
          else
            echo "Warning: game-assemblies/Managed not found"
          fi

          HARMONY_PATH=$(find game-assemblies -name "0Harmony.dll" -type f | head -1)
          if [ -n "$HARMONY_PATH" ]; then
            cp "$HARMONY_PATH" Assemblies/Mono/
            echo "Copied 0Harmony.dll into Assemblies/Mono/"
          else
            echo "Warning: 0Harmony.dll not found in game-assemblies"
          fi

      - name: Create CI Build Properties
        run: |
          cat > local.build.props << 'EOF'
          <Project>
              <PropertyGroup>
                  <MonoAssembliesPath>$(MSBuildThisFileDirectory)Assemblies/Mono</MonoAssembliesPath>
                  <MelonLoaderAssembliesPath>$(MSBuildThisFileDirectory)Assemblies/Mono</MelonLoaderAssembliesPath>
                  <Il2CppAssembliesPath>$(MSBuildThisFileDirectory)Assemblies/Il2Cpp</Il2CppAssembliesPath>
              </PropertyGroup>
          </Project>
          EOF

      - name: Restore Dependencies
        run: dotnet restore S1MAPI.csproj /p:Configuration=Mono

      - name: Build S1MAPI
        run: dotnet build S1MAPI.csproj --no-restore -c Mono -v normal

      - name: Upload S1MAPI Mono Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S1MAPI-Mono
          path: bin/Mono/netstandard2.1/S1MAPI_Mono.dll

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Build documentation
        run: docfx docfx.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
        if: github.event_name != 'pull_request'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
